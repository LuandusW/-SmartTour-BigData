version: "3.8"
 
services:
  postgres:
    image: postgres:17
    container_name: postgres-prueba
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ClaseDB2026!
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./datasets/Data_Lab04:/Data_Lab04
    networks:
      - red-bbdd
    restart: unless-stopped
 
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-prueba
    environment:
      PGADMIN_DEFAULT_EMAIL: alumno@clase.com
      PGADMIN_DEFAULT_PASSWORD: AdminClase2026!
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - red-bbdd
    restart: unless-stopped
 
  jupyter:
    image: jupyter/scipy-notebook
    container_name: smarttour-jupyter
    ports:
      - "8888:8888"
    networks:
      - red-bbdd
 
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./datasets:/home/jovyan/datasets
 
    environment:
      - JUPYTER_ENABLE_LAB=yes
 
    command:
      start-notebook.sh
      --NotebookApp.token=''
 
volumes:
  datos_postgres:
 
networks:
  red-bbdd: